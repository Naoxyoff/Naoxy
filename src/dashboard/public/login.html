<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orbis Dashboard - Connexion</title>
    <style>
        body { margin: 0 !important; padding: 0 !important; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif !important; background-color: #050505 !important; color: #f4f4f5 !important; display: flex !important; justify-content: center !important; align-items: center !important; height: 100vh !important; overflow: hidden !important; position: relative !important; }
        body::before { content: "" !important; position: absolute !important; top: -150px !important; left: -150px !important; width: 450px !important; height: 450px !important; border: 1px solid rgba(124, 58, 237, 0.15) !important; border-radius: 50% !important; pointer-events: none !important; }
        body::after { content: "" !important; position: absolute !important; bottom: -200px !important; right: -200px !important; width: 550px !important; height: 550px !important; border: 1px solid rgba(124, 58, 237, 0.12) !important; border-radius: 50% !important; pointer-events: none !important; }
        .dot-top { position: absolute !important; top: 250px !important; left: 120px !important; width: 14px !important; height: 14px !important; background-color: #7c3aed !important; border-radius: 50% !important; filter: drop-shadow(0 0 8px #7c3aed) !important; }
        .dot-bottom { position: absolute !important; bottom: 300px !important; right: 250px !important; width: 28px !important; height: 28px !important; background-color: #7c3aed !important; border-radius: 50% !important; filter: drop-shadow(0 0 12px #7c3aed) !important; opacity: 0.7 !important; }
        .login-container { background-color: #0f0f11 !important; border: 1px solid #1f1f23 !important; padding: 2.5rem !important; border-radius: 12px !important; width: 100% !important; max-width: 380px !important; z-index: 10 !important; text-align: center !important; }
        h1 { font-size: 1.5rem !important; margin: 0 0 0.5rem 0 !important; font-weight: 700 !important; color: #f4f4f5 !important; }
        p.subtitle { color: #71717a !important; font-size: 0.85rem !important; margin: 0 0 2rem 0 !important; }
        .btn-discord { display: inline-flex !important; align-items: center !important; justify-content: center !important; width: 100% !important; padding: 0.8rem !important; background-color: #5865F2 !important; border: none !important; border-radius: 6px !important; color: #fff !important; font-size: 0.95rem !important; font-weight: 600 !important; text-decoration: none !important; cursor: pointer !important; transition: background-color 0.2s !important; }
        .btn-discord:hover { background-color: #4752C4 !important; }
    </style>
</head>
<body>
    <div class="dot-top"></div><div class="dot-bottom"></div>
    <div class="login-container">
        <h1>Orbis Dashboard</h1>
        <p class="subtitle">Connectez-vous pour gérer votre instance</p>
        <a href="/auth/discord" class="btn-discord">Se connecter avec Discord</a>
    </div>
</body>
</html>
