<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Orbis Dashboard - Connexion</title><style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background-color:#07050f;background-image:url("https://images2.imgbox.com/eb/7e/Zz4R5dKq_o.png");background-size:cover;background-position:center;background-repeat:no-repeat;color:#f4f4f5;display:flex;justify-content:center;align-items:center;height:100vh;overflow:hidden;position:relative}body::before{content:"";position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(4,2,10,0.25);z-index:1}.login-container{background:rgba(10,8,20,0.75);border:1px solid rgba(147,51,234,0.4);box-shadow:0 20px 50px rgba(0,0,0,0.7),0 0 30px rgba(147,51,234,0.2);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:3rem 2.5rem;border-radius:16px;width:100%;max-width:380px;z-index:10;text-align:center}h1{font-size:1.8rem;margin-bottom:0.5rem;font-weight:800;color:#fff;text-shadow:0 0 10px rgba(147,51,234,0.6)}p.subtitle{color:#b4acc9;font-size:.9rem;margin-bottom:2.5rem}.btn-discord{display:inline-flex;align-items:center;justify-content:center;width:100%;padding:.9rem;background:linear-gradient(135deg,#5865F2 0%,#4752C4 100%);border:none;border-radius:8px;color:#fff;font-size:1rem;font-weight:600;text-decoration:none;cursor:pointer;transition:all .2s;box-shadow:0 4px 15px rgba(88,101,242,0.4)}.btn-discord:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(88,101,242,0.6)}</style></head><body><div class="login-container"><h1>Orbis Dashboard</h1><p class="subtitle">Connectez-vous pour gérer votre instance</p><a href="/auth/discord" class="btn-discord">Se connecter avec Discord</a></div></body></html>
