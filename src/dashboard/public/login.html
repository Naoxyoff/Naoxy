<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orbis Dashboard - Connexion</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body { 
            margin: 0; 
            padding: 0; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background-color: #050505; 
            /* On utilise le nom exact de ton fichier image ici */
            background-image: url('32c8c336-1721-4bbc-9b57-14d1d4ca45e4.png'); 
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            color: #f4f4f5; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            overflow: hidden; 
        }

        .login-container { 
            background-color: rgba(15, 15, 17, 0.75); 
            backdrop-filter: blur(10px); 
            border: 1px solid rgba(31, 31, 35, 0.8); 
            padding: 2.5rem; 
            border-radius: 16px; 
            width: 100%; 
            max-width: 400px; 
            z-index: 10; 
            text-align: center; 
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
        }

        h1 { 
            font-size: 1.6rem; 
            margin: 0 0 0.5rem 0; 
            font-weight: 700; 
            color: #f4f4f5; 
        }

        p.subtitle { 
            color: #a1a1aa; 
            font-size: 0.9rem; 
            margin: 0 0 2rem 0; 
        }

        .btn-discord { 
            display: inline-flex; 
            align-items: center; 
            justify-content: center; 
            width: 100%; 
            padding: 0.9rem; 
            background-color: #5865F2; 
            border: none; 
            border-radius: 8px; 
            color: #fff; 
            font-size: 0.95rem; 
            font-weight: 600; 
            text-decoration: none; 
            cursor: pointer; 
            transition: background-color 0.2s, transform 0.1s; 
        }

        .btn-discord:hover { 
            background-color: #4752C4; 
        }

        .btn-discord:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <div class="login-container">
        <h1>Orbis Dashboard</h1>
        <p class="subtitle">Connecte-toi avec Discord</p>
        <a href="/auth/discord" class="btn-discord">Se connecter avec Discord</a>
    </div>

</body>
</html>
