<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orbis - Configuration du serveur</title>
    <style>
        :root {
            --bg-color: #06070b;
            --text-main: #ffffff;
            --text-muted: #94a3b8;
            --card-bg: rgba(15, 23, 42, 0.6);
            --border-glow: rgba(139, 92, 246, 0.3);
            --accent-color: #8b5cf6;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', 'Segoe UI', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 50px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .logo {
            font-weight: 700;
            font-size: 1.2rem;
            background: linear-gradient(135deg, #fff, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            gap: 30px;
            align-items: center;
        }

        .nav-links a {
            color: var(--text-muted);
            text-decoration: none;
            transition: color 0.2s;
        }

        .nav-links a:hover, .nav-links a.active {
            color: var(--text-main);
        }

        .user-badge {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(255, 255, 255, 0.05);
            padding: 6px 15px;
            border-radius: 20px;
            font-size: 0.9rem;
        }

        .main-container {
            display: flex;
            flex: 1;
            padding: 30px 50px;
            gap: 40px;
        }

        .sidebar {
            width: 280px;
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            height: fit-content;
        }

        .server-profile {
            display: flex;
            align-items: center;
            gap: 12px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .server-avatar {
            width: 45px;
            height: 45px;
            border-radius: 12px;
            background: #1e293b;
            object-fit: cover;
        }

        .server-info h3 {
            font-size: 0.95rem;
            margin-bottom: 3px;
        }

        .server-info span {
            font-size: 0.75rem;
            color: #10b981;
        }

        .menu-category {
            font-size: 0.75rem;
            text-transform: uppercase;
            color: var(--text-muted);
            letter-spacing: 1px;
            margin-top: 10px;
            margin-bottom: 5px;
        }

        .menu-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            border-radius: 8px;
            color: var(--text-muted);
            text-decoration: none;
            transition: all 0.2s;
            font-size: 0.9rem;
        }

        .menu-item:hover, .menu-item.active {
            background: rgba(139, 92, 246, 0.15);
            color: var(--text-main);
            border: 1px solid var(--border-glow);
        }

        .content-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .page-header h1 {
            font-size: 1.8rem;
            margin-bottom: 5px;
        }

        .page-header p {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .grid-cards {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-top: 20px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 25px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .card h4 {
            color: var(--text-muted);
            font-size: 0.85rem;
            font-weight: 500;
        }

        .card .value {
            font-size: 2rem;
            font-weight: 700;
        }
    </style>
</head>
<body>

    <header>
        <a href="/dashboard" class="logo">ORBIS.SYS</a>
        <div class="nav-links">
            <a href="/">Accueil</a>
            <a href="/dashboard" class="active">Dashboard</a>
            <div class="user-badge" id="user-badge">Chargement...</div>
            <a href="/auth/logout" style="color: #ef4444;">Déconnexion</a>
        </div>
    </header>

    <div class="main-container">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="server-profile">
                <img src="" alt="Server Icon" class="server-avatar" id="sidebar-server-icon">
                <div class="server-info">
                    <h3 id="sidebar-server-name">Chargement...</h3>
                    <span>● Bot connecté</span>
                </div>
            </div>

            <span class="menu-category">Navigation</span>
            <a href="#" class="menu-item active">📊 Vue d'ensemble</a>
            <a href="#" class="menu-item">🎫 Tickets</a>
            <a href="#" class="menu-item">📜 Logs</a>
            <a href="#" class="menu-item">🛡️ Modération</a>
            <a href="#" class="menu-item">⚙️ Modules</a>
        </div>

        <!-- Content -->
        <div class="content-area">
            <div class="page-header">
                <h1>Vue d'ensemble</h1>
                <p>État actuel du bot et de la configuration sur ce serveur.</p>
            </div>

            <div class="grid-cards">
                <div class="card">
                    <h4>Tickets Ouverts</h4>
                    <div class="value" style="color: #3b82f6;">0</div>
                </div>
                <div class="card">
                    <h4>Tickets Fermés</h4>
                    <div class="value" style="color: #10b981;">14</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const pathSegments = window.location.pathname.split('/');
        const guildId = pathSegments[pathSegments.length - 1];

        fetch('/api/user')
            .then(res => res.json())
            .then(data => {
                if (!data.user) {
                    window.location.href = '/auth/discord';
                    return;
                }
                document.getElementById('user-badge').innerText = data.user.username;

                const guild = data.guilds.find(g => g.id === guildId);
                if (guild) {
                    document.getElementById('sidebar-server-name').innerText = guild.name;
                    if (guild.icon) {
                        document.getElementById('sidebar-server-icon').src = `https://cdn.discordapp.com/icons/${guild.id}/${guild.icon}.png`;
                    } else {
                        document.getElementById('sidebar-server-icon').src = 'https://cdn.discordapp.com/embed/avatars/0.png';
                    }
                }
            });
    </script>
</body>
</html>
